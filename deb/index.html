<!DOCTYPE html>
<html lang="ja" style="height:100%;margin:0;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ブラウザ deb 実行環境 | Browser Debian Terminal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      height: 100%;
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 8px 12px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header a { color: #58a6ff; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    #status { color: #8b949e; font-size: 12px; }
    #console {
      flex: 1;
      margin: 0;
      padding: 8px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: #0d1117;
      color: #c9d1d9;
      outline: none;
      font-size: 14px;
      line-height: 1.4;
    }
    .hint {
      padding: 6px 12px;
      background: #21262d;
      font-size: 12px;
      color: #8b949e;
      border-top: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <header>
    <strong>deb 実行環境</strong>
    <span id="status">起動中...</span>
    <a href="https://webvm.io" target="_blank" rel="noopener">公式 WebVM</a>
    <a href="https://cheerpx.io/docs/" target="_blank" rel="noopener">CheerpX Docs</a>
    <a href="README.md">README</a>
  </header>
  <pre id="console" tabindex="0"></pre>
  <div class="hint">
    クリックしてフォーカス → キーボード入力可。
    .deb 例: <code>curl -LO URL && sudo dpkg -i *.deb && sudo apt-get install -f</code>
    （ネットワークには Tailscale Exit Node 推奨）
  </div>

  <script type="module">
    import * as CheerpX from "https://cxrtnc.leaningtech.com/1.2.8/cx.esm.js";

    const statusEl = document.getElementById("status");
    const consoleEl = document.getElementById("console");

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    try {
      setStatus("ディスクイメージ取得中...");

      // 公開 Debian イメージ (WebVM 公式)
      const cloudDevice = await CheerpX.CloudDevice.create(
        "wss://disks.webvm.io/debian_large_20230522_5044875331.ext2"
      );

      // IndexedDB に書き込みを永続化
      const idbDevice = await CheerpX.IDBDevice.create("deb-block1");
      const overlayDevice = await CheerpX.OverlayDevice.create(cloudDevice, idbDevice);

      // HTTP 上のファイルや JS データ用（必要に応じて拡張）
      const webDevice = await CheerpX.WebDevice.create("");
      const dataDevice = await CheerpX.DataDevice.create();

      setStatus("Linux 環境作成中...");

      const cx = await CheerpX.Linux.create({
        mounts: [
          { type: "ext2", path: "/", dev: overlayDevice },
          { type: "dir", path: "/app", dev: webDevice },
          { type: "dir", path: "/data", dev: dataDevice },
          { type: "devs", path: "/dev" },
        ],
      });

      cx.setConsole(consoleEl);

      setStatus("bash 起動中...");

      await cx.run("/bin/bash", [""], {
        env: [
          "HOME=/home/user",
          "USER=user",
          "SHELL=/bin/bash",
          "EDITOR=vim",
          "LANG=C.UTF-8",
          "LC_ALL=C",
          "TERM=xterm",
        ],
        cwd: "/home/user",
        uid: 1000,
        gid: 1000,
      });

      setStatus("準備完了 — クリックして入力");
      consoleEl.focus();
    } catch (err) {
      setStatus("エラー");
      consoleEl.textContent =
        "起動に失敗しました。\n\n" +
        "原因の多くは Cross-Origin Isolation (COOP/COEP) ヘッダー不足です。\n" +
        "以下のヘッダーを付けて配信してください:\n" +
        "  Cross-Origin-Embedder-Policy: require-corp\n" +
        "  Cross-Origin-Opener-Policy: same-origin\n\n" +
        "ローカルなら localhost でも COOP/COEP は必須です。\n" +
        "簡易に試す場合は https://webvm.io を利用してください。\n\n" +
        String(err && err.stack ? err.stack : err);
      console.error(err);
    }
  </script>
</body>
</html>
